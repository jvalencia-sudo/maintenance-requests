# Usage: cp .env.example .env && docker compose up --build
# Host ports are configurable in .env to avoid clashes with services already running locally.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copia .env.example a .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copia .env.example a .env}
      POSTGRES_DB: ${POSTGRES_DB:?Copia .env.example a .env}
    ports:
      # Published on loopback only, for local development and inspection tools.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 forces TCP: on first start the image runs a temporary init server that only
      # listens on the Unix socket, and a socket check would report healthy too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./src
      dockerfile: MaintenanceRequests.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB:?Copia .env.example a .env};Username=${POSTGRES_USER:?Copia .env.example a .env};Password=${POSTGRES_PASSWORD:?Copia .env.example a .env}"
      APPLY_MIGRATIONS: ${APPLY_MIGRATIONS:-true}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Copia .env.example a .env}
    depends_on:
      db:
        condition: service_healthy
    # Safety net for transient startup failures (for example, the database restarting).
    restart: on-failure
    ports:
      - "${API_PORT:-8080}:8080"

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Copia .env.example a .env}
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  db-data:
